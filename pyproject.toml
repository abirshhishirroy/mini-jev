[project]
name = "mini-jev"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [{ name = "Abir Roy", email = "abirroydm@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.15.0",
    "datasets>=2.19.1",
    "numpy>=2.5.2",
    "openai>=2.54.0",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "torch>=2.6.0",
    "tqdm>=4.66.5",
    "transformers>=5.17.0",
]


[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"

[tool.uv.sources]
torch = { index = "pytorch-cu124" }

[project.scripts]
mini-jev = "mini_jev:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
